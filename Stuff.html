<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts.js"></script>
</head>
<body>
    <section class="desktop">
        <div class="taskbar transparent">
            <div class="logo">
                <img src="images/sy.png" alt="Apple Logo">
            </div>
            <div class="menu-text">
                <h3>File</h3>
                <h3>Edit</h3>
                <h3>View</h3>
                <h3>Go</h3>
                <h3>Window</h3>
                <h3>Help</h3>
            </div>
        </div>
        <div class="homepage">
            <!-- Projects Window -->
            <div class="window shadow" id="projects-window">
                <div class="windowheader">
                    <div class="dot" onclick="windowClose('projects-window')" id="close"></div>
                    <div class="dot"></div>
                    <div class="dot maximise"></div>
                </div>
                <div class="projects">
                    <div class="menu"></div>
                    <div class="details"></div>
                </div>
            </div>
            <!-- Documents Window -->
            <div class="window shadow" id="documents-window">
                <div class="windowheader">
                    <div class="dot" onclick="windowClose('documents-window')" id="close"></div>
                    <div class="dot"></div>
                    <div class="dot maximise"></div>
                </div>
            </div>
            <!-- Settings Window -->
            <div class="window shadow" id="settings-window">
                <div class="windowheader">
                    <div class="dot" onclick="windowClose('settings-window')" id="close"></div>
                    <div class="dot"></div>
                    <div class="dot maximise"></div>
                </div>
            </div>
            <!-- Help Window -->
            <div class="window shadow" id="help-window">
                <div class="windowheader">
                    <div class="dot" onclick="windowClose('help-window')" id="close"></div>
                    <div class="dot"></div>
                    <div class="dot maximise"></div>
                </div>
            </div>
        </div>
        <div class="tray">
            <!-- Tray icons will be dynamically generated here -->
        </div>
    </section>
</body>
</html>
